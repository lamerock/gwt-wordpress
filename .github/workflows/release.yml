name: Release theme zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # git archive honors export-ignore rules in .gitattributes
      - name: Build zip
        run: git archive --prefix=gwt-wordpress/ -o gwt-wordpress.zip HEAD

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" gwt-wordpress.zip --clobber
